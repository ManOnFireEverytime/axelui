<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Preloader with Angled Falling Effect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Syne:wght@400..800&display=swap"
        rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Syne", sans-serif;
            background-color: #f0f0f0;
        }

        .preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #571829;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: all 3s ease-in-out;
        }

        .preloader-text {
            font-size: 3rem;
            color: #ffffff;
            font-weight: bold;
            transform-origin: top left;
            animation: angled-fall 3s ease-in-out forwards;
        }

        @keyframes angled-fall {
            0% {
                transform: rotate(0deg);
            }

            25% {
                transform: rotate(30deg);
            }

            100% {
                transform: translateY(100vh) rotate(30deg);
            }
        }

        .content {
            padding: 2rem;
        }
    </style>
</head>

<body>
    <div class="preloader">
        <div class="preloader-text">Aloma Blog</div>
    </div>

    <div class="content">
        <h1>Welcome to the Site</h1>
        <p>This is the actual site content.</p>
    </div>

    <script>
        window.addEventListener('load', function () {
            const preloader = document.querySelector('.preloader');
            preloader.style.opacity = '0';
            setTimeout(function () {
                preloader.style.display = 'none';
            }, 4000);
        });
    </script>
</body>

</html>
